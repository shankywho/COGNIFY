services:
  postgres:
    image: postgres:16
    container_name: cognify-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cognify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cognify-redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: cognify-server
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/cognify
      JWT_SECRET: dev_jwt_secret_key_12345
      REDIS_HOST: redis
      PORT: 3000
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      SERVICE_ROLE: api

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: cognify-worker
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/cognify
      JWT_SECRET: dev_jwt_secret_key_12345
      REDIS_HOST: redis
      PORT: 3001
      NODE_ENV: development
      SERVICE_ROLE: worker

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: cognify-web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  postgres_data:
